[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzydroid"
version = "0.1.0"
description = "Shared Python code for fuzzydroid Claude Code plugins (Fusion 360, URDF, RViz, Gazebo, IsaacSim)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aldrin Inbaraj" },
]
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
cli-anything-fusion = "fuzzydroid.fusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fuzzydroid"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
