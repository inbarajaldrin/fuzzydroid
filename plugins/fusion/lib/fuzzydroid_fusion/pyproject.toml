[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzydroid-fusion"
version = "0.2.0"
description = "fuzzydroid fusion plugin: CLI + bridge client for Autodesk Fusion 360 (search, open, inspect, export STEP/STL/URDF, exec Python in Fusion's runtime)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aldrin Inbaraj" },
]
dependencies = [
    "click>=8.0.0",
    "prompt-toolkit>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "ruff>=0.1",
]

[project.scripts]
fzd-fusion = "fuzzydroid_fusion.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fuzzydroid_fusion"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
