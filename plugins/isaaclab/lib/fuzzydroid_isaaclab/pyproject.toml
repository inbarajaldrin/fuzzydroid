[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzydroid-isaaclab"
version = "0.1.0"
description = "fuzzydroid isaaclab plugin: detect / setup / doctor for Isaac Lab installs, with per-profile launch-guard enforcement"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aldrin Inbaraj" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fuzzydroid_isaaclab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
