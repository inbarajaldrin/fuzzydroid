[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzydroid-kicad"
version = "0.1.0"
description = "Live KiCad control: official IPC and an embedded main-thread bridge"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["click>=8,<9", "kicad-python==0.8.0", "mcp>=1.26,<2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.11"]

[project.scripts]
fzd-kicad = "fuzzydroid_kicad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fuzzydroid_kicad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
