[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fuzzydroid-isaacsim"
version = "0.2.0"
description = "fuzzydroid isaacsim plugin: detect / setup / doctor for NVIDIA Isaac Sim installs and the omni.kit.mcp bridge"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
    { name = "Aldrin Inbaraj" },
]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["fuzzydroid_isaacsim"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
